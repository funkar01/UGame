<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UGame: Pixelate Yourself</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="./assets/index-D7Mo3Z-G.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DcEZliev.css">
  </head>
  <body>
    <div id="app">
      <!-- Start Screen UI -->
      <div id="start-screen" class="glass-panel">
        <div id="loading-overlay" style="position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(30,41,59,0.95); border-radius:24px; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:20;">
          <div class="spinner" style="border:4px solid rgba(255,255,255,0.1); border-top-color:#3b82f6; border-radius:50%; width:40px; height:40px; animation:spin 1s linear infinite;"></div>
          <p style="margin-top:1rem; color:white; font-weight:600;" id="loading-text">Loading AI Models...</p>
        </div>

        <h1>UGAME</h1>
        <p>A Mario-like Platformer where YOU are the avatar.</p>
        
        <div class="actions" id="action-buttons">
          <button id="btn-camera" class="btn primary">
            <span class="icon">📷</span> Use Camera
          </button>
          
          <div class="upload-wrapper">
            <input type="file" id="file-upload" accept="image/*" />
            <button id="btn-upload" class="btn secondary">
              <span class="icon">🖼️</span> Upload Photo
            </button>
          </div>
        </div>

        <div id="camera-container" class="hidden" style="display:flex; flex-direction:column; align-items:center;">
          <video id="camera-video" autoplay playsinline style="width:100%; max-width:300px; border-radius:12px; margin-bottom:1rem; border:2px solid #334155;"></video>
          <button id="btn-take-photo" class="btn primary" style="width:100%;">📸 Capture</button>
        </div>

        <div id="preview-section" class="hidden">
          <h3>Your Avatar Face</h3>
          <canvas id="face-preview" width="64" height="64"></canvas>
          <button id="btn-next" class="btn action">Continue</button>
          <button id="btn-retake" class="btn secondary" style="margin-top:0.5rem; width:100%;">Retake</button>
        </div>

        <div id="mode-section" class="hidden" style="text-align: left; margin-top: 1rem;">
          <h3 style="text-align: center; margin-bottom: 0.5rem; font-size: 1.2rem;">Select Team</h3>
          <div style="display: flex; gap: 1rem; justify-content: center; margin-bottom: 1.5rem;" id="team-buttons">
            <button id="btn-team-red" class="btn" style="background: #ef4444; color: white; flex: 1; border: 2px solid transparent;">Team Red</button>
            <button id="btn-team-blue" class="btn" style="background: #3b82f6; color: white; flex: 1; border: 2px solid transparent;">Team Blue</button>
          </div>

          <div id="pc-instructions" style="background: rgba(255,255,255,0.05); padding: 1rem; border-radius: 12px; font-size: 0.95rem; line-height: 1.6; border: 1px solid rgba(255,255,255,0.1);">
            <strong style="color: #e2e8f0; display: block; margin-bottom: 0.5rem;">🎮 Controls:</strong>
            • Move: <kbd style="background: #334155; padding: 2px 6px; border-radius: 4px;">A</kbd> / <kbd style="background: #334155; padding: 2px 6px; border-radius: 4px;">D</kbd> or Arrows<br>
            • Jump: <kbd style="background: #334155; padding: 2px 6px; border-radius: 4px;">W</kbd> or <kbd style="background: #334155; padding: 2px 6px; border-radius: 4px;">Space</kbd> (Double tap for Double Jump)<br>
            • Shoot: <kbd style="background: #334155; padding: 2px 6px; border-radius: 4px;">F</kbd>
          </div>

          <div id="mobile-instructions" class="hidden" style="background: rgba(59,130,246,0.1); padding: 1rem; border-radius: 12px; font-size: 0.95rem; line-height: 1.6; border: 1px solid rgba(59,130,246,0.3); margin-top: 1rem;">
            <strong style="color: #60a5fa; display: block; margin-bottom: 0.5rem;">📱 Mobile Controls:</strong>
            Use the on-screen Gamepad to Move, Jump, and Shoot!
          </div>

          <button id="btn-start-game" class="btn action hidden" style="margin-top: 1.5rem; width: 100%;">START COMBAT</button>
        </div>
      </div>

      <!-- Game Container -->
      <div id="game-container" class="hidden">
        <canvas id="game-canvas" width="800" height="600"></canvas>
        
        <div id="mobile-gamepad" class="hidden">
          <div class="dpad">
            <button id="btn-left" class="gamepad-btn">◀</button>
            <button id="btn-right" class="gamepad-btn">▶</button>
          </div>
          <div class="action-pad">
            <button id="btn-shoot" class="gamepad-btn shoot-btn">🎯</button>
            <button id="btn-jump" class="gamepad-btn jump-btn">▲</button>
          </div>
        </div>
      </div>
      
    </div>
  </body>
</html>
